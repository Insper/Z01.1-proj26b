# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Teste
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integracao:
    runs-on: ubuntu-latest

    steps:
      # Baixa o histórico completo do Git
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Configura o Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Instala o pytest
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # Define a base e o commit que serao auditados
      - name: Definir intervalo da auditoria
        id: intervalo
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base=$EVENT_BEFORE" >> "$GITHUB_OUTPUT"
          fi

          echo "target=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      # Verifica os arquivos
      - name: Auditar arquivos por commit
        env:
          AUDIT_BASE: ${{ steps.intervalo.outputs.base }}
          AUDIT_TARGET: ${{ steps.intervalo.outputs.target }}
        run: |
          if [ -z "$AUDIT_BASE" ] ||
             [ "$AUDIT_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Base da auditoria indisponivel."
            echo "Defina um commit-base confiavel para a primeira execucao."
            exit 1
          fi

          python -m pytest -v f_Assembly/tests/CICD.py
          
  build:
    #needs: integracao
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    
    env:
      SIM: ghdl 
      
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.8
      uses: actions/setup-python@v2
      with:
        python-version: 3.8
    
    - name: Install ubuntu dependencies
      run: |
        sudo apt install ghdl
        
    - name: Install python dependencies
      run: |
        pip3 install -r requirements.txt
        pip3 install numpy
      
    - name: teste vhdl
      run: |
        SIM=ghdl pytest -s --ignore-glob="*Assembly*"
        
    - name: teste Assembly
      run: |
        cd f_Assembly/
        pytest -s        
    
